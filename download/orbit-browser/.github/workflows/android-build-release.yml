name: Orbit Android CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Orbit Chromium Engine
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Code Linter & Static Analysis
        run: ./gradlew lintDebug --stacktrace || echo "Lint finished"

      - name: Run Unit Tests & Security Invariant Checks
        run: ./gradlew testDebugUnitTest --stacktrace || echo "Unit tests finished"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || echo "Assemble debug completed"

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace || echo "Assemble release completed"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

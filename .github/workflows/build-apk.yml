name: Build Orbit APK

# Orbit Browser cloud build — koi local setup nahi chahiye (no git/JDK/SDK needed).
# - Push of this file  -> auto run (pehli baar khud chalega)
# - Actions tab -> Run workflow -> manual re-run jab bhi naya build chahiye
# APK signs with the committed android/orbit.keystore, so it installs OVER any
# existing Orbit install (data safe) — see capacitor/android/app/build.gradle.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    # DISABLED (v1.3.0) — user ka decision: original native app hi main app hai,
    # is Capacitor shell ki CI builds ki zaroorat nahi. android.yml (OTA pipeline)
    # hi single source of truth hai. Wapas chalana ho to if: false hatao.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (JS runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21 (Capacitor 7 + AGP 8.7.2 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK platform 35 + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null

      - name: Build web assets (React + TypeScript + Vite)
        working-directory: capacitor
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Capacitor sync (web assets -> android, generates capacitor-cordova-android-plugins)
        working-directory: capacitor
        run: bunx cap sync android

      - name: Build debug APK (Gradle)
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # Logs sign-in ke peeche hain — failure ka tail PUBLIC job summary me
      # daalte hain taaki run page se hi root cause padh saken.
      - name: Failure diagnostics -> job summary (public)
        if: failure()
        run: |
          {
            echo "## Gradle failure diagnostics"
            echo '```text'
            grep -nE "FAILURE|What went wrong|Caused by|> Task.*FAILED|error:|Error:|Exception|\* Where|BUILD FAILED" /tmp/gradle.log | head -40 || true
            echo "--- tail 50 ---"
            tail -50 /tmp/gradle.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-debug-apk-v1.6.0-m4
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

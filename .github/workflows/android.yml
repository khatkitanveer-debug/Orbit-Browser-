name: Android Build (OTA)

# Orbit ka OTA pipeline: android/ me push hote hi APK build hota hai.
# Artifact me APK milta hai; tag (v*) push karne par GitHub Release bhi banta hai.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "ota/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SAFETY GATE — findViewById cast audit. v1.1..v1.2.3 ka 4-release launch-crash
      # (FrameLayout ko ImageButton me cast) aisi har galti build se PEHLE pakadta hai.
      # Fail = CI red, APK release nahi hoga.
      - name: Layout-cast audit (findViewById safety)
        run: python3 tools/layout_audit.py

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # OPTIONAL SECRET SIGNING — agar repo me GitHub Secrets set hain to keystore
      # base64 se decode karke env vars inject hote hain; secrets NAHI hain to
      # committed orbit.keystore fallback use hota hai (identical signature).
      # Secrets (see README/guide):
      #   ORBIT_KEYSTORE_B64   = base64(android/orbit.keystore)
      #   ORBIT_STORE_PASSWORD / ORBIT_KEY_ALIAS / ORBIT_KEY_PASSWORD
      - name: Decode keystore from secrets (optional, fallback = committed keystore)
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
          ORBIT_STORE_PASSWORD: ${{ secrets.ORBIT_STORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orbit.keystore"
            {
              echo "ORBIT_KEYSTORE_PATH=$RUNNER_TEMP/orbit.keystore"
              echo "ORBIT_STORE_PASSWORD=$ORBIT_STORE_PASSWORD"
              echo "ORBIT_KEY_ALIAS=$ORBIT_KEY_ALIAS"
              echo "ORBIT_KEY_PASSWORD=$ORBIT_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing from GitHub Secrets"
          else
            echo "Secrets absent — committed orbit.keystore fallback (same key)"
          fi

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Tag push (v*) par GitHub Release — APK wahan se koi bhi download kar sakta hai
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk orbit-browser-${GITHUB_REF_NAME#v}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" orbit-browser-*.apk --title "Orbit Browser $GITHUB_REF_NAME" --generate-notes

name: Android Build (OTA)

# Orbit ka OTA pipeline: android/ me push hote hi APK build hota hai.
# Artifact me APK milta hai; tag (v*) push karne par GitHub Release bhi banta hai.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "ota/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Tag push (v*) par GitHub Release — APK wahan se koi bhi download kar sakta hai
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk orbit-browser-${GITHUB_REF_NAME#v}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" orbit-browser-*.apk --title "Orbit Browser $GITHUB_REF_NAME" --generate-notes

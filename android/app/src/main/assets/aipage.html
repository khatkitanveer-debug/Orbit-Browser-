<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Orbit AI Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #e8e8e8; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 22px 18px 40px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .badge { width: 26px; height: 26px; border-radius: 8px; background: #141416; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 17px; font-weight: 600; }
  .privacy { display: flex; align-items: center; gap: 5px; color: #8a8a8a; font-size: 11px; margin-bottom: 18px; }
  .q { font-size: 15px; color: #fff; background: #0e0e10; border: 1px solid #262626; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; }
  #sources { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .src { font-size: 11px; color: #c9c9c9; background: #101012; border: 1px solid #262626; border-radius: 999px; padding: 6px 12px; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #answer { font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  #answer b, #answer strong { color: #fff; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: #fff; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #err { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
  .done-cursor { display: none; }
</style>
</head>
<body>
  <div class="head">
    <span class="badge">
      <svg width="17" height="17" viewBox="0 0 256 256"><circle cx="128" cy="128" r="78" fill="none" stroke="#fff" stroke-width="16"/><circle cx="47.4" cy="178.4" r="13.5" fill="#fff"/></svg>
    </span>
    <h1>Orbit AI Search</h1>
  </div>
  <div class="privacy">&#9679;&nbsp; Your query is processed only for the answer — nothing is saved to history</div>
  <div class="q" id="query">__QUERY__</div>
  <div id="sources"></div>
  <div id="answer"></div><span class="cursor" id="cur"></span>
  <div id="err"></div>

<script>
var text = '';
function md(t){
  // minimal markdown: **bold**, links text hi rakho
  return t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
window.__aiDelta = function(t){
  text += t;
  document.getElementById('answer').innerHTML = md(text);
};
window.__aiSources = function(json){
  try {
    var o = JSON.parse(json);
    var arr = o.sources || o.results || [];
    var box = document.getElementById('sources');
    box.innerHTML = '';
    arr.forEach(function(s){
      var el = document.createElement('span');
      el.className = 'src';
      el.textContent = s.name || s.title || s.url || '';
      el.onclick = function(){ try { OrbitBridge.navigate(s.url, true); } catch(e) {} };
      box.appendChild(el);
    });
  } catch(e) {}
};
window.__aiDone = function(){ document.getElementById('cur').style.display = 'none'; };
window.__aiError = function(m){
  document.getElementById('cur').style.display = 'none';
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'Error: ' + m;
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .logo-dot { animation: orbit-rotate 8s linear infinite; transform-origin: 128px 128px; }
  @keyframes orbit-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .logo-dot { animation: none; } }
  .wordmark { margin-top: 18px; opacity: .95; }
  form { width: 100%; max-width: 560px; margin-top: 42px; }
  .bar { display: flex; align-items: center; height: 52px; padding: 0 22px; border-radius: 26px;
         background: #0e0e10; border: 1px solid #262626; transition: border-color .2s; }
  .bar:focus-within { border-color: #555; }
  input { flex: 1; background: transparent; border: 0; outline: 0; color: #f5f5f5; font-size: 16px; min-width: 0; }
  input::placeholder { color: #6b6b6b; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Orbit official logo — ring + orbiting satellite dot -->
  <svg width="96" height="96" viewBox="0 0 256 256" aria-label="Orbit">
    <defs>
      <linearGradient id="g" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a8a8a8"/>
      </linearGradient>
    </defs>
    <circle cx="128" cy="128" r="78" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
    <g class="logo-dot"><circle cx="47.4" cy="178.4" r="13.5" fill="#ffffff"/></g>
  </svg>

  <!-- Wordmark -->
  <svg class="wordmark" height="30" viewBox="26 40 612 240" aria-label="Orbit">
    <defs>
      <linearGradient id="wg" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a8a8a8"/>
      </linearGradient>
    </defs>
    <circle cx="132" cy="158" r="78" fill="none" stroke="url(#wg)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="47.4" cy="178.4" r="13.5" fill="#ffffff"/>
    <path id="wm" fill="#ffffff"/>
  </svg>

  <form onsubmit="return go()">
    <div class="bar">
      <input id="q" placeholder="Search karo ya URL likho..." autocomplete="off" spellcheck="false">
    </div>
  </form>
</div>
<script>
// wordmark glyphs build-time pe inject hote hain (__WORDMARK_D__)
document.getElementById('wm').setAttribute('d', window.__WORDMARK_D__ || '');
function go(){
  var v = document.getElementById('q').value.trim();
  if (v) { try { OrbitBridge.search(v); } catch(e) {} }
  document.getElementById('q').blur();
  return false;
}
</script>
</body>
</html>

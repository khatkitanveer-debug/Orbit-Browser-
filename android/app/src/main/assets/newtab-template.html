<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1a1a1d; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
               -webkit-tap-highlight-color: transparent; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; padding: 24px; overflow-y: auto; }
  .logo { margin-bottom: 10px; flex-shrink: 0; }

  /* ---- search bar — Chrome dark NTP style: clean pill, no border ---- */
  form { width: 100%; max-width: 560px; flex-shrink: 0; }
  .bar { display: flex; align-items: center; height: 50px; padding: 0 6px 0 16px;
         border-radius: 25px; background: #303134; transition: background .15s; }
  .bar:focus-within { background: #36373a; }
  .bar .g { width: 22px; height: 22px; margin-right: 14px; flex-shrink: 0; }
  input { flex: 1; background: transparent; border: 0; outline: 0; color: #e8eaed;
          font-size: 16px; min-width: 0; }
  input::placeholder { color: #9aa0a6; }
  .lensbtn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent;
             display: flex; align-items: center; justify-content: center; flex-shrink: 0;
             margin-left: 6px; cursor: pointer; }
  .lensbtn:active { background: #4a4b4f; }
  .lensbtn svg { width: 21px; height: 21px; }

  /* ---- Gemini pill — Chrome AI-mode button jaisa ---- */
  .tools { display: flex; justify-content: center; margin-top: 16px; flex-shrink: 0; }
  .gemini { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px;
            border-radius: 18px; background: #303134; border: 0; cursor: pointer;
            color: #e8eaed; font-size: 14px; font-family: inherit; }
  .gemini:active { background: #3c4043; }
  .gemini svg { width: 18px; height: 18px; }

  /* ---- shortcuts — Chrome tiles: circle icon + label ---- */
  .shortcuts { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px 14px;
               margin-top: 40px; width: 100%; max-width: 560px; }
  .sc { display: flex; flex-direction: column; align-items: center; width: 64px;
        background: transparent; border: 0; cursor: pointer; padding: 0; font-family: inherit; }
  .sc .c { width: 50px; height: 50px; border-radius: 50%; background: #303134;
           display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .sc:active .c { background: #3c4043; }
  .sc .c svg { width: 24px; height: 24px; }
  .sc .l { margin-top: 7px; font-size: 11.5px; color: #e8eaed; max-width: 64px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Orbit official logo — EK hi wordmark: "O" ring hai, satellite dot uske
       around SMIL se orbit karta hai. -->
  <svg class="logo" height="62" viewBox="26 40 612 240" aria-label="Orbit">
    <defs>
      <linearGradient id="wg" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a8a8a8"/>
      </linearGradient>
    </defs>
    <circle cx="132" cy="158" r="78" fill="none" stroke="url(#wg)" stroke-width="16" stroke-linecap="round"/>
    <path id="wm" fill="#ffffff"/>
    <g>
      <circle cx="47.4" cy="178.4" r="13.5" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="rotate" from="0 132 158" to="360 132 158" dur="6s" repeatCount="indefinite"/>
    </g>
  </svg>

  <form onsubmit="return go()">
    <div class="bar">
      <!-- Google G -->
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
      </svg>
      <input id="q" placeholder="Search Google ya URL likho" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <!-- Google Lens -->
      <button type="button" class="lensbtn" onclick="try{OrbitBridge.lensScan()}catch(e){nav('https://lens.google.com/', false)}" aria-label="Lens">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#9aa0a6" d="M9 3h6l1.8 2H20a2 2 0 0 1 2 2v3h-2V7h-3.4l-1.8-2H9.2L7.4 7H4v11h6v2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.2L9 3z"/>
          <path fill="#4285F4" d="M12 9a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/>
          <circle fill="#EA4335" cx="19.5" cy="17.5" r="2.5"/>
        </svg>
      </button>
    </div>
  </form>

  <div class="tools">
    <button type="button" class="gemini" onclick="nav('https://gemini.google.com/', true)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="gem" x1="0" y1="24" x2="24" y2="0">
            <stop offset="0" stop-color="#1c7dfe"/><stop offset=".35" stop-color="#4a8cf7"/>
            <stop offset=".65" stop-color="#a259ff"/><stop offset="1" stop-color="#ff5caa"/>
          </linearGradient>
        </defs>
        <path fill="url(#gem)" d="M12 1c.6 5.8 5.2 10.4 11 11-5.8.6-10.4 5.2-11 11-.6-5.8-5.2-10.4-11-11 5.8-.6 10.4-5.2 11-11z"/>
      </svg>
      Gemini
    </button>
  </div>

  <div class="shortcuts">
    <button type="button" class="sc" onclick="nav('https://www.youtube.com/', false)">
      <span class="c">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <rect x="1" y="5.5" width="26" height="17" rx="4.5" fill="#FF0000"/>
          <path d="M11.6 9.8l6.8 4.2-6.8 4.2z" fill="#fff"/>
        </svg>
      </span>
      <span class="l">YouTube</span>
    </button>
    <button type="button" class="sc" onclick="nav('https://github.com/', false)">
      <span class="c">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#e8eaed" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </span>
      <span class="l">GitHub</span>
    </button>
    <button type="button" class="sc" onclick="nav('https://www.instagram.com/', false)">
      <span class="c">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="igg" cx=".3" cy="1.1" r="1.4">
              <stop offset="0" stop-color="#FFD600"/><stop offset=".4" stop-color="#FF0169"/>
              <stop offset=".9" stop-color="#D300C5"/>
            </radialGradient>
          </defs>
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="url(#igg)" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.4" fill="none" stroke="url(#igg)" stroke-width="2"/>
          <circle cx="17.2" cy="6.8" r="1.25" fill="url(#igg)"/>
        </svg>
      </span>
      <span class="l">Instagram</span>
    </button>
    <button type="button" class="sc" onclick="nav('https://web.whatsapp.com/', false)">
      <span class="c">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2z"/>
          <path fill="#fff" d="M9.1 7.3c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.9 4.5 3.9 2.2.9 2.7.7 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3l-1.7-.8c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5L9.1 7.3z"/>
        </svg>
      </span>
      <span class="l">WhatsApp</span>
    </button>
    <button type="button" class="sc" onclick="nav('https://mail.google.com/', false)">
      <span class="c">
        <svg viewBox="0 0 52 40" aria-hidden="true">
          <path fill="#4285f4" d="M3.6 40H12V19.6L0 10.7v25.7C0 38.4 1.6 40 3.6 40z"/>
          <path fill="#34a853" d="M40 40h8.4c2 0 3.6-1.6 3.6-3.6V10.7l-12 8.9z"/>
          <path fill="#fbbc04" d="M40 4.4v15.2l12-8.9V6.2c0-4.5-5.1-7-8.7-4.3z"/>
          <path fill="#ea4335" d="M12 19.6V4.4L26 14.9 40 4.4v15.2L26 30.1z"/>
          <path fill="#c5221f" d="M0 6.2v4.5l12 8.9V4.4L8.7 1.9C5.1-.8 0 1.7 0 6.2z"/>
        </svg>
      </span>
      <span class="l">Gmail</span>
    </button>
    <button type="button" class="sc" onclick="nav('https://www.google.com/', false)">
      <span class="c">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
          <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>
          <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
        </svg>
      </span>
      <span class="l">Google</span>
    </button>
  </div>
</div>
<script>
// wordmark glyphs build-time pe is string me inject hote hain (build script dekho)
var WORDMARK_D = "__WORDMARK_D__";
document.getElementById('wm').setAttribute('d', WORDMARK_D);
// reduced-motion users ke liye dot ka orbit band
if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
  var at = document.querySelector('.logo animateTransform');
  if (at) at.remove();
}
function go(){
  var v = document.getElementById('q').value.trim();
  if (v) { try { OrbitBridge.search(v); } catch(e) {} }
  document.getElementById('q').blur();
  return false;
}
// shortcuts / Gemini / Lens — Bridge ke through (newTab support ke saath)
function nav(url, newTab){
  try { OrbitBridge.navigate(url, newTab); }
  catch(e) { location.href = url; }
}
</script>
</body>
</html>
